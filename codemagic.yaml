workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - api_credentials # Pulls your hidden variables from the dashboard
    scripts:
      - name: Install dependencies
        script: flutter packages pub get

      - name: Generate .env file
        script: |
          # This creates the .env file physically on the build machine
          echo "TMDB_READ_ACCESS_TOKEN=$TMDB_READ_ACCESS_TOKEN" > .env

      - name: Run build_runner
        script: dart run build_runner build --delete-conflicting-outputs

      - name: Build Unsigned Archive
        script: |
          flutter build ipa \
            --release \
            --no-codesign \
            --obfuscate \
            --split-debug-info=build/ios/debug-info \
            --build-number=1

      - name: Package Unsigned IPA manually
        script: |
          cd build/ios/archive/Runner.xcarchive/Products/Applications
          mkdir -p Payload
          cp -R Runner.app Payload/
          zip -qr spovies.ipa Payload
          rm -rf Payload

          mkdir -p $CM_BUILD_DIR/build/ios/unsigned_ipa
          mv spovies.ipa $CM_BUILD_DIR/build/ios/unsigned_ipa/

    artifacts:
      - build/ios/unsigned_ipa/*.ipa
