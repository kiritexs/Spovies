name: spovies
description: "Cross-platform movie & TV discovery app built with Flutter, Riverpod and the TMDB API."
publish_to: 'none'
version: 0.1.4

environment:
  sdk: ^3.10.8

dependencies:
  cached_network_image: ^3.4.1
  dio: ^5.9.1
  envied: ^1.3.3
  file_picker: ^10.3.10
  flutter:
    sdk: flutter
  flutter_inappwebview: ^6.1.5
  flutter_riverpod: ^3.2.1
  freezed_annotation: ^3.1.0
  go_router: ^17.3.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  json_annotation: ^4.11.0
  package_info_plus: ^9.0.1
  path_provider: ^2.1.5
  public_suffix: ^3.0.0
  riverpod_annotation: ^4.0.2
  share_plus: ^12.0.1
  shimmer: ^3.0.0
  url_launcher: ^6.3.2
  window_manager: ^0.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  envied_generator: ^1.3.3
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/js/
    - assets/fonts/OFL.txt
  # Bundled rather than fetched at runtime: works offline, makes no request
  # to Google at launch, and every weight has its own file (a single
  # regular face rendered as synthetic bold clipped text in chips).
  fonts:
    - family: SplineSans
      fonts:
        - asset: assets/fonts/SplineSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/SplineSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/SplineSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/SplineSans-Bold.ttf
          weight: 700

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  windows: 
    generate: true
    image_path: "assets/logo.ico"
  remove_alpha_ios: true